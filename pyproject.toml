[build-system]
requires = [
  "setuptools>=77",
  "setuptools-scm>=8",
  "Cython>=3.1",
  "CT3>=3.3.3",
  "numpy",  # imported (not linked) while rendering the wrappers
]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# the JIT fallback compiles from these at runtime, so they must ship in the wheel
"*" = ["py.typed", "*.pyx", "*.c", "*.h", "LICENSE*", "*.md"]

[project]
name = "spatial-graph"
dynamic = ["version"]
description = "A spatial graph datastructure for python."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { email = "funkej@janelia.hhmi.org", name = "Jan Funke" },
  { email = "talley.lambert@gmail.com", name = "Talley Lambert" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "witty>=0.3.2",
  "CT3>=3.3.3",
  "numpy>=2.3.2; python_version >= '3.14'",
  "numpy>=2.1.0; python_version >= '3.13'",
  "numpy>=1.26.0; python_version >= '3.12'",
  "numpy>=1.23.2",
  "setuptools>=75.8.0",
  "typing_extensions>=4.5.0",  # witty<=0.3.1 imports it without declaring it
]

[dependency-groups]
test = ["pytest>=8.3.5", "pytest-cov>=6.1.1"]
test-codspeed = [{ include-group = "test" }, "pytest-codspeed >=3.2.0"]
dev = [
  { include-group = "test" },
  "ipython>=8.18.1",
  "mypy>=1.15.0",
  "prek>=0.4.4",
  "pytest-benchmark>=5.1.0",  # specifically excluded from test group for ci
  "ruff>=0.11.10",
]
docs = [
  "mkdocs>=1.6.1",
  "mkdocs-api-autonav>=0.3.0",
  "mkdocs-material>=9.6.15",
  "mkdocstrings-python>=1.16.12",
  "ruff",
]


[project.urls]
homepage = "https://github.com/funkelab/spatial_graph"
repository = "https://github.com/funkelab/spatial_graph"

[tool.cibuildwheel]
# a single abi3 build per platform covers every supported CPython
build = "cp311-*"
# never let a wheel silently degrade to pure Python
environment = { SPATIAL_GRAPH_REQUIRE_PREBUILT = "1" }
test-groups = ["test"]
# these exercise the prebuilt modules in the repaired wheel without needing a
# compiler; cross-version and numpy-only checks live in the CI workflow
test-command = "pytest {project}/tests/test_prebuilt.py -q"

[tool.ruff]
target-version = "py311"
line-length = 88
fix = true
unsafe-fixes = true

[tool.ruff.lint]
select = [
  "E",   # style errors
  "F",   # flakes
  "W",   # warnings
  "I",   # isort
  "UP",  # pyupgrade
  "TC",  # typing
  "TID", # tidy imports
  "RUF", # ruff
]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
files = "*.py"
strict = false
disallow_any_generics = false
disallow_subclassing_any = false
show_error_codes = true
pretty = true

[tool.pytest.ini_options]
addopts = "-v --color=yes"
filterwarnings = ["error", "ignore:'cgi' is deprecated"]


[tool.coverage.report]
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "@overload",
  "except ImportError",
  "raise AssertionError",
  "\\.\\.\\.",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]

[tool.coverage.run]
source = ['spatial_graph']
